<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FortiSIEM 安全報告 | SOC Dashboard</title>
<style>
:root{--bg:#060b16;--bg2:#0b1324;--panel:#0e1a30;--panel2:#12213d;--line:#1d3357;--txt:#d6e2f5;--mut:#7f93b5;--cy:#22d3ee;--gr:#34d399;--am:#fbbf24;--rd:#f87171;--pu:#a78bfa;--mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px;background:#060b16}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#0f2a4a 0%,transparent 60%),linear-gradient(#060b16,#050913);color:var(--txt);font:14px/1.55 -apple-system,'Segoe UI','Noto Sans TC','PingFang HK','Microsoft JhengHei',sans-serif}
a{color:var(--cy)}
.mono{font-family:var(--mono)}
nav{position:sticky;top:0;z-index:50;background:rgba(6,11,22,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:8px 16px;overflow-x:auto;white-space:nowrap}
nav .brand{font-family:var(--mono);color:var(--cy);font-weight:700;margin-right:12px;letter-spacing:.5px}
nav a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:13px}
nav a:hover,nav a.active{color:#fff;background:var(--panel2)}
header.hero{padding:28px 24px 8px;max-width:1500px;margin:0 auto}
.hero h1{margin:0;font-size:26px;letter-spacing:.3px}
.hero h1 span{color:var(--cy);font-family:var(--mono)}
.hero .sub{color:var(--mut);font-family:var(--mono);font-size:12.5px;margin-top:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--line);background:var(--bg2);margin-right:6px}
.b-live{color:var(--gr);border-color:#1f6f55}.b-ro{color:var(--am);border-color:#7a5a12}
main{max-width:1500px;margin:0 auto;padding:0 24px 60px}
section{margin-top:28px}
section>h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
section>h2 .num{font-family:var(--mono);color:var(--cy);font-size:13px;border:1px solid var(--line);padding:1px 7px;border-radius:5px}
section>p.desc{color:var(--mut);margin:0 0 12px;font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--cy))}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--c,var(--cy));margin-top:2px}
.kpi .s{color:var(--mut);font-size:11.5px;font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:13.5px;color:#e8f1ff;display:flex;justify-content:space-between;gap:8px}
.card h3 small{color:var(--mut);font-weight:400;font-family:var(--mono);font-size:11px}
.chart{width:100%;height:300px}
.chart.tall{height:380px}
.chart.short{height:240px}
.na{display:flex;align-items:center;justify-content:center;height:120px;color:var(--am);font-family:var(--mono);font-size:12.5px;border:1px dashed #5b4a1a;border-radius:8px;background:#1a160a33;text-align:center;padding:8px}
.tbl-wrap{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid #16284a;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#10203d;color:#9fb6da;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:#fff}
th.sorted-asc:after{content:" ▲";color:var(--cy)}th.sorted-desc:after{content:" ▼";color:var(--cy)}
tr:hover td{background:#13264a}
td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
td.code,td .code{font-family:var(--mono);font-size:11.5px;color:#b9cbe8;overflow-wrap:anywhere}
td.nw{white-space:nowrap}
.filter{width:100%;margin:0 0 8px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:6px;font-family:var(--mono);font-size:12px}
.sev{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;font-weight:700}
.sev-HIGH,.sev-high,.sev-Critical{background:#4a1518;color:#fca5a5}.sev-MEDIUM,.sev-Warning{background:#4a3712;color:#fcd34d}.sev-LOW,.sev-Normal{background:#0f3a2c;color:#6ee7b7}
.finding{border-left:3px solid var(--c,var(--am));background:var(--panel);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.finding b{color:#fff}
.finding .tag{font-family:var(--mono);font-size:11px;color:var(--c,var(--am));margin-right:6px}
.dd{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;margin-bottom:14px}
.dd h3{margin:0 0 6px;font-size:15px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:3px 12px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--mut)}
.kv div:nth-child(even){font-family:var(--mono);word-break:break-all}
pre.raw{background:#050a14;border:1px solid var(--line);padding:8px;border-radius:6px;font-size:11px;white-space:pre-wrap;word-break:break-all;color:#9fd6ff;max-height:180px;overflow:auto;margin:6px 0}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--line);padding:1px 7px;border-radius:999px;margin:2px 3px 2px 0}
.ok{color:var(--gr)}.bad{color:var(--rd)}
footer{color:var(--mut);text-align:center;font-size:12px;font-family:var(--mono);padding:30px 0}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.kv{grid-template-columns:1fr}main,header.hero{padding-left:12px;padding-right:12px}}
@media print{nav{position:static}}
</style>
<script>/*ECHARTS*/</script>
</head>
